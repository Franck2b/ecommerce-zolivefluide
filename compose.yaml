services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zolive
      POSTGRES_PASSWORD: zolive
      POSTGRES_DB: zolive
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zolive -d zolive"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zolive:zolive@db:5432/zolive
      APP_URL: http://localhost:3001
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "3001:3000"
    profiles: ["full"]

volumes:
  db-data:
